name: Klockvakt

on:
  schedule:
    # En gång per dygn kl 17:00 finsk tid. GitHub Actions cron körs i UTC,
    # och Finland byter mellan UTC+2 (vintertid) och UTC+3 (sommartid), så
    # det behövs två rader för att träffa 17:00 lokal tid året runt.
    # Minut 37 i stället för hel timme: GitHub köar schemalagda körningar
    # hårdast vid jämna timmar, och sedan mitten av oktober har körningar
    # startat 3-9 timmar sent. Schemat är därför bara en reserv; den
    # egentliga starten kl 17 sker med "gh workflow run" från en dator.
    - cron: "37 13 * 3-10 *"      # mar-okt (sommartid, UTC+3) -> 16:37 EEST
    - cron: "37 14 * 11,12,1,2 *" # nov-feb (vintertid, UTC+2) -> 16:37 EET
  workflow_dispatch: {}  # tillåter manuell körning från GitHub-fliken Actions

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python -m klockvakt.main
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Spara uppdaterat state och dashboard
        run: |
          git config user.name "klockvakt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen.json docs/index.html
          git diff --staged --quiet || git commit -m "Uppdatera state och dashboard [skip ci]"
          git push
