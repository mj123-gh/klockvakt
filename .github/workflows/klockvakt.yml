name: Klockvakt

on:
  schedule:
    # En gång per dygn kl 17:00 finsk tid. GitHub Actions cron körs i UTC,
    # och Finland byter mellan UTC+2 (vintertid) och UTC+3 (sommartid), så
    # det behövs två rader för att träffa 17:00 lokal tid året runt:
    - cron: "0 14 * 3-10 *"      # mar-okt (sommartid, UTC+3) -> 17:00 EEST
    - cron: "0 15 * 11,12,1,2 *" # nov-feb (vintertid, UTC+2) -> 17:00 EET
  workflow_dispatch: {}  # tillåter manuell körning från GitHub-fliken Actions

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python -m klockvakt.main
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Spara uppdaterat state
        run: |
          git config user.name "klockvakt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen.json
          git diff --staged --quiet || git commit -m "Uppdatera state [skip ci]"
          git push
